# Build the image and push it to GitHub Container Registry.
#
#   ghcr.io/ar4ikov/vllm-qwen-boost:latest        tracks main
#   ghcr.io/ar4ikov/vllm-qwen-boost:sha-<7>       immutable, one per commit
#   ghcr.io/ar4ikov/vllm-qwen-boost:1.2.3, 1.2, 1  on a v1.2.3 tag (plus a GitHub release)
#
# The Dockerfile is the quality gate: it applies every patch of the HyperQwen series
# (the hyperqwen/ submodule) against the pinned vLLM and runs verify.sh --install, so
# a patch that no longer applies fails the build and nothing is pushed.

name: image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # The image is ~9.5 GB and the default runner does not have room to build it
      # next to the preinstalled toolchains.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ar4ikov/vllm-qwen-boost
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=vllm-qwen-boost
            org.opencontainers.image.description=Qwen3.8-27B AWQ-W4A16-ASYM on consumer GPUs: HyperQwen on vLLM 0.29 + zero-point int8 Marlin + vision
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/ar4ikov/vllm-qwen-boost:buildcache
          cache-to: type=registry,ref=ghcr.io/ar4ikov/vllm-qwen-boost:buildcache,mode=max

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `ghcr.io/ar4ikov/vllm-qwen-boost:${{ steps.meta.outputs.version }}`

            ```bash
            IMAGE_TAG=${{ steps.meta.outputs.version }} docker compose --profile single up -d
            ```
