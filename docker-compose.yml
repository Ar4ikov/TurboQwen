# Qwen3.8-27B AWQ-W4A16-ASYM (Ar4ikov) on consumer GPUs, containerized.
#
#   docker compose --profile single up -d     # one or a few people chatting (MTP / DFlash2 speculation)
#   docker compose --profile batch  up -d     # API backend, many concurrent requests (int8 Marlin)
#   docker compose --profile tp2    up -d     # two cards, tensor parallel, single-user profile
#   docker compose run --rm prepare           # just download the prepared checkpoint
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in .env (copy .env.example). CHECKPOINT=uncensored|base picks the model;
# every HyperQwen launcher variable (SPEC, CTX, MAX_LEN, KV_MEM, INT8_ACT, ...) passes
# straight through. One GPU runs one profile at a time.
x-qwen: &qwen
  image: ghcr.io/ar4ikov/vllm-hyprfastqwen:${IMAGE_TAG:-latest}
  build: .
  pull_policy: missing
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - qwen-cache:/cache

x-serve: &serve
  <<: *qwen
  ports:
    - "${PORT:-18020}:${PORT:-18020}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-18020}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

x-one-gpu: &one-gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: ${GPU_COUNT:-1}
          capabilities: [gpu]

services:
  prepare:
    <<: *qwen
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single
    deploy: *one-gpu

  batch:
    <<: *serve
    profiles: [batch]
    command: batch
    deploy: *one-gpu

  tp2:
    <<: *serve
    profiles: [tp2]
    command: single
    environment:
      HOME: /cache
      EXTRA_ARGS: --tensor-parallel-size 2
      VISION_OFFLOAD: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-2}
              capabilities: [gpu]

volumes:
  qwen-cache:
