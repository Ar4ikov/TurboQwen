# GPUStack (v2.2+) custom inference backend for this image.
#
#   UI: Inference Backends -> Add -> from YAML, paste this file
#   API: curl -X POST http://<server>/v2/inference-backends/from-yaml \
#          -H "Content-Type: application/json" -b gpustack_session=<jwt> \
#          --data "$(python3 -c 'import json;print(json.dumps({"content":open("gpustack/backend.yaml").read()}))')"
#
# GPUStack renders default_run_command with {{model_path}} (the downloaded checkpoint),
# {{port}}, {{model_name}} and {{gpu_count}}, appends the deployment's backend parameters
# and starts the container on the selected GPUs. boost/gpustack.sh turns the KEY=VALUE
# tokens into HyperQwen knobs (a deployment's env overrides them) and passes any
# "--flag" on to vllm serve.
backend_name: hyperqwen-custom   # GPUStack requires custom backend names to end with -custom
description: |
  HyperQwen for the Ar4ikov Qwen3.8-27B AWQ-W4A16-ASYM checkpoints: vLLM 0.29.0 with the
  syv-ai patch series (MTP / DFlash2 speculative decoding, int8 Marlin GEMMs, KVarN) plus
  marlin-int8-asym-zp for zero-point weights, the vision tower kept on. Image:
  ghcr.io/ar4ikov/turboqwen-vllm (https://github.com/Ar4ikov/TurboQwen; 1.0.0-1.3.0 were
  published as ghcr.io/ar4ikov/vllm-qwen-boost, 1.3.1-1.3.2 as ghcr.io/ar4ikov/vllm-hyprfastqwen;
  both still receive every new tag).

  Deploy one of the prepared checkpoints:
    Ar4ikov/Qwen3.8-27B-Uncensored-AWQ-W4A16-ASYM-HyperQwen-fast   (fastest single-user)
    Ar4ikov/Qwen3.8-27B-Uncensored-AWQ-W4A16-ASYM-HyperQwen        (int8 lm_head)
    Ar4ikov/Qwen3.8-27B-AWQ-W4A16-ASYM-HyperQwen-fast  /  ...-HyperQwen  (the base model)

  Backend parameters are vllm serve flags: --max-model-len, --kv-cache-memory (per GPU,
  bytes), --kv-cache-dtype bfloat16|int8_per_token_head|fp8, --max-num-seqs,
  --gpu-memory-utilization, --enable-prefix-caching, --default-chat-template-kwargs,
  --reasoning-parser, --tool-call-parser, ... (the first six are translated into the
  HyperQwen launcher's knobs so its attention backend, speculation and pool math agree
  with them; the rest pass through). Speculation and vision are env: SPEC=dflash2|mtp|off,
  VISION=1|0, VISION_OFFLOAD, IMAGES_PER_PROMPT (default 10), MODE=batch, INT8_ACT=int8,
  PREFILL_ATTN=int8, DFLASH_TOKENS.
  On Ampere fp8 KV means SPEC=mtp (FlashInfer); int8_per_token_head keeps DFlash2 and is
  the verified long-context cache (262k with a 7.08 GiB pin per 3090 at TP=2);
  int4_per_token_head is HyperQwen's experimental 256k route; turboquant_k8v4 |
  turboquant_4bit_nc | turboquant_k3v4_nc | turboquant_3bit_nc run vLLM's TurboQuant
  backend with DFlash2 (the image carries the spec-as-decode patch that makes the verify
  block a decode there; README "KV cache types" has the measured table). gpustack/register.py
  registers this backend, a deployment, its model route and the metrics mapping that
  puts the instance on the GPUStack Model dashboard.
health_check_path: /health
default_version: "1.3.3"
version_configs:
  "1.3.3":
    image_name: ghcr.io/ar4ikov/turboqwen-vllm:1.3.3
    entrypoint: /bin/bash
    custom_framework: cuda
  "1.3.2":
    image_name: ghcr.io/ar4ikov/vllm-hyprfastqwen:1.3.2
    entrypoint: /bin/bash
    custom_framework: cuda
  "1.3.1":
    image_name: ghcr.io/ar4ikov/vllm-hyprfastqwen:1.3.1
    entrypoint: /bin/bash
    custom_framework: cuda
  "1.3.0":
    image_name: ghcr.io/ar4ikov/vllm-qwen-boost:1.3.0
    entrypoint: /bin/bash
    custom_framework: cuda
  "1.2.1":
    image_name: ghcr.io/ar4ikov/vllm-qwen-boost:1.2.1
    entrypoint: /bin/bash
    custom_framework: cuda
  "1.2.0":
    image_name: ghcr.io/ar4ikov/vllm-qwen-boost:1.2.0
    entrypoint: /bin/bash
    custom_framework: cuda
  "1.1.1":
    image_name: ghcr.io/ar4ikov/vllm-qwen-boost:1.1.1
    entrypoint: /bin/bash
    custom_framework: cuda
  "1.1.0":
    image_name: ghcr.io/ar4ikov/vllm-qwen-boost:1.1.0
    entrypoint: /bin/bash
    custom_framework: cuda
  latest:
    image_name: ghcr.io/ar4ikov/turboqwen-vllm:latest
    entrypoint: /bin/bash
    custom_framework: cuda
default_entrypoint: /bin/bash
default_run_command: >-
  /app/boost/gpustack.sh --model {{model_path}} --port {{port}}
  --served-model-name {{model_name}} TP={{gpu_count}}
  SPEC=dflash2 CTX=fast VISION=1 PREFIX_CACHE=1
default_backend_param: []
default_env:
  NVIDIA_DISABLE_REQUIRE: "1"
  VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
framework_index_map:
  cuda:
    - "1.3.2"
    - "1.3.1"
    - "1.3.0"
    - "1.2.1"
    - "1.2.0"
    - "1.1.1"
    - "1.1.0"
    - latest
